[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-pricing-lab"
version = "0.1.0"
description = "Independent, reproducible quantitative finance portfolio research"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "psutil>=6,<8"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
benchmark = ["QuantLib==1.44"]
research = ["pyarrow==26.0.0"]

[tool.setuptools.package-data]
pricing_lab = ["diagnostics/*.json"]

[tool.setuptools.packages.find]
include = ["pricing_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
