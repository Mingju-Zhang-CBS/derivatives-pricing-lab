<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="435" viewBox="0 0 1200 435" role="img" aria-labelledby="title desc"><title id="title">Research workflow</title><desc id="desc">1. Specify the model: Spot, strike, rates, volatility, maturity and units.; 2. Price analytically: Broadcast call/put prices and closed-form Greeks.; 3. Check identities: Parity, limiting cases and finite-difference sensitivities.; 4. Estimate by sampling: Plain or antithetic payoffs with correct sampling units.; 5. Hedge on common paths: Rebalance stock and cash; include all trading costs.; 6. Compare tradeoffs: Sampling error, hedge risk, cost and measured workload.</desc><rect width="1200" height="435" rx="16" fill="#f3f6f9" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#668096" /></marker></defs><text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#20364c" font-weight="700">From input contract to documented conclusion</text><rect x="20" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="40" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">01  SPECIFY THE MODEL</text><text x="40" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Spot, strike, rates, volatility,</text><text x="40" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">maturity and units.</text><rect x="420" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="440" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">02  PRICE ANALYTICALLY</text><text x="440" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Broadcast call/put prices and</text><text x="440" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">closed-form Greeks.</text><rect x="820" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="840" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">03  CHECK IDENTITIES</text><text x="840" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Parity, limiting cases and</text><text x="840" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">finite-difference sensitivities.</text><rect x="820" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="840" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">04  ESTIMATE BY SAMPLING</text><text x="840" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Plain or antithetic payoffs with</text><text x="840" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">correct sampling units.</text><rect x="420" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="440" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">05  HEDGE ON COMMON PATHS</text><text x="440" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Rebalance stock and cash; include</text><text x="440" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">all trading costs.</text><rect x="20" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="40" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">06  COMPARE TRADEOFFS</text><text x="40" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Sampling error, hedge risk, cost</text><text x="40" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">and measured workload.</text><line x1="383" y1="138" x2="413" y2="138" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="783" y1="138" x2="813" y2="138" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="1000" y1="199" x2="1000" y2="255" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="813" y1="319" x2="783" y2="319" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="413" y1="319" x2="383" y2="319" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><text x="30" y="414" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526b80" font-weight="400">Inputs, timing assumptions and evidence remain explicit at every stage.</text></svg>